<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#111114"/>
      <stop offset="50%" stop-color="#0a0a0c"/>
      <stop offset="100%" stop-color="#050506"/>
    </radialGradient>
    <radialGradient id="glow" cx="46%" cy="38%" r="30%">
      <stop offset="0%" stop-color="rgba(52,211,153,0.12)"/>
      <stop offset="100%" stop-color="rgba(52,211,153,0)"/>
    </radialGradient>
    <linearGradient id="flag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5d050"/>
      <stop offset="35%" stop-color="#ffd966"/>
      <stop offset="65%" stop-color="#e8b820"/>
      <stop offset="100%" stop-color="#c49a18"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="224" fill="url(#glow)"/>
  <!-- Subtle grid -->
  <g stroke="rgba(52,211,153,0.025)" stroke-width="0.8">
    <line x1="0" y1="256" x2="1024" y2="256"/><line x1="0" y1="512" x2="1024" y2="512"/><line x1="0" y1="768" x2="1024" y2="768"/>
    <line x1="256" y1="0" x2="256" y2="1024"/><line x1="512" y1="0" x2="512" y2="1024"/><line x1="768" y1="0" x2="768" y2="1024"/>
  </g>
  <!-- Pole -->
  <line x1="440" y1="225" x2="440" y2="735" stroke="rgba(220,225,222,0.8)" stroke-width="5" stroke-linecap="round"/>
  <!-- Flag -->
  <path d="M442,225 C530,230 600,250 720,310 C600,360 520,370 442,430 Z" fill="url(#flag)"/>
  <path d="M442,225 C510,230 560,245 620,280 C550,300 500,310 442,340 Z" fill="rgba(255,255,255,0.12)"/>
  <!-- Hole -->
  <ellipse cx="440" cy="740" rx="35" ry="13" fill="#050506" stroke="rgba(52,211,153,0.2)" stroke-width="1.5"/>
  <!-- Ball -->
  <circle cx="510" cy="726" r="20" fill="#e8e8e8"/>
  <circle cx="506" cy="722" r="6" fill="rgba(255,255,255,0.5)"/>
  <!-- AI badge -->
  <circle cx="760" cy="840" r="48" fill="none" stroke="rgba(52,211,153,0.2)" stroke-width="1.5"/>
  <text x="760" y="848" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-weight="700" font-size="52" fill="rgba(52,211,153,0.6)">AI</text>
</svg>